[project]
site_name = "dishka-fastmcp"
site_description = "Dishka dependency injection for FastMCP tools, resources, and prompts."
site_author = "bagowix"
site_url = "https://bagowix.github.io/dishka-fastmcp/"
repo_url = "https://github.com/bagowix/dishka-fastmcp"
edit_uri = "blob/main/docs/"
copyright = "Copyright &copy; 2026 dishka-fastmcp authors"

nav = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Lifecycle and scopes" = "lifecycle.md" },
    { "FastMCP context" = "context.md" },
    { "API reference" = "reference.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
    "content.action.view",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.sections",
    "navigation.top",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
